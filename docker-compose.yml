services:
  fullstack:
    build:
      context: .
      target: distroless
    volumes:
      - ./backend/data:/data
    ports:
      - "8080:8080"
    environment:
      - SESSION_SECRET=this_is_dev_only

  backend:
    build:
      context: .
      target: backend-dev
    volumes:
      - ./backend/app:/app
      - ./backend/data:/data
      - go-cache:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      - SESSION_SECRET=this_is_dev_only
      - GOMODCACHE=/go/pkg/mod
      - GOCACHE=/root/.cache/go-build
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      target: frontend-builder
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/package.json:/app/package.json
    environment:
      - DEVMODE=true
    ports:
      - "5173:5173"
    command: npm run dev -- --host
  
  goose:
    build:
      context: .
      target: goose
    volumes:
      - ./backend:/app
    environment:
      - GOOSE_DRIVER=sqlite3
      - GOOSE_DBSTRING=/app/data/macro.db
      - GOOSE_MIGRATION_DIR=/app/migrations
    working_dir: /app

volumes:
  go-cache:
  go-build: