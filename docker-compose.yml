services:

  backend:
    build:
      context: .
      target: base
    volumes:
      - .:/repo
      - ./backend/data:/data
      - go-cache:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      - SESSION_SECRET=this_is_dev_only
      - GOMODCACHE=/go/pkg/mod
      - GOCACHE=/root/.cache/go-build
    ports:
      - "8080:8080"
    command: >
      sh -c "npm i --prefix frontend && \
             npm run build --prefix frontend && \
             air"

  frontend:
    build:
      context: .
      target: base
    volumes:
      - .:/repo
    working_dir: /repo/frontend
    ports:
      - "5173:5173"
    command: >
      sh -c "npm i && \
             npm run dev -- --host"

  goose:
    build:
      context: .
      target: goose
    working_dir: /repo
    volumes:
      - .:/repo
    environment:
      - GOOSE_DRIVER=sqlite3
      - GOOSE_DBSTRING=/repo/backend/data/macro.db
      - GOOSE_MIGRATION_DIR=/repo/backend/db/migrations

volumes:
  go-cache:
  go-build: