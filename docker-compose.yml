secrets:
  session_secret:
    file: ./session_secret.txt

services:
  fullstack:
    build:
      context: .
      dockerfile: Dockerfile.fullstack
    volumes:
      - ./backend/data:/app/data
    secrets:
      - session_secret
    ports:
      - "8080:8080"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - ./backend/data:/app/data
    environment:
      - DEVMODE=true
    secrets:
      - session_secret
    ports:
      - "8080:8080"
  
  golang:
    image: golang:1.26-alpine
    volumes:
      - ./backend/app:/app
    working_dir: /app
  
  goose:
    build:
      context: .
      dockerfile: Dockerfile.goose
    volumes:
      - ./backend:/app
    environment:
      - GOOSE_DRIVER=sqlite3
      - GOOSE_DBSTRING=/app/data/macro.db
      - GOOSE_MIGRATION_DIR=/app/migrations
    working_dir: /app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/package.json:/app/package.json
    environment:
      - DEVMODE=true
    ports:
      - "5173:5173"
  
  npm:
    image: node:20-alpine
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/package.json:/app/package.json
    working_dir: /app
    command: sh

  sqlite:
    image: alpine/sqlite:latest
    volumes:
      - ./backend/data:/app
    working_dir: /app
    command: macro.db