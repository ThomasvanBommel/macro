name: CI/CD Pipeline

on:
  push:
  pull_request:
    branches: [main]

jobs:

  # this will likely break in the future as I removed the setup steps for node and go for speed, 
  # but it should be fine for now since the build and test steps are cached
  mono-build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOOS: linux
      GIN_MODE: release
    steps:
      - uses: actions/checkout@v6

      # frontend build + tests
      - name: Cache npm dependencies
        id: cache-npm
        uses: actions/cache@v5
        with:
          path: 'frontend/node_modules'
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install npm dependencies (if missing cache)
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      # backend build + tests
      - name: Copy frontend build to backend
        run: mkdir -p backend/frontend && cp -r frontend/build backend/frontend/build

      - name: Set Go cache paths
        id: go-cache-paths
        run: |
          echo "go-build=$(go env GOCACHE)" >> $GITHUB_OUTPUT
          echo "go-mod=$(go env GOMODCACHE)" >> $GITHUB_OUTPUT

      - name: Cache Go dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.go-build }}
            ${{ steps.go-cache-paths.outputs.go-mod }}
          key: ${{ runner.os }}-go-cache-${{ hashFiles('backend/go.sum') }}
          restore-keys: ${{ runner.os }}-go-cache-

      - name: Run Go tests
        run: cd backend && go test ./...

      - name: Build Go application
        run: |
          cd backend && go build -ldflags="-s -w" \
            -tags='no_postgres no_clickhouse no_mssql no_mysql prod' \
            -o macro .

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: macro
          path: backend/macro
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: mono-build
    outputs:
      image_digest: ${{ steps.build_and_push.outputs.digest }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: macro

      - name: Create minimal Dockerfile for production image
        run: |
          echo 'FROM gcr.io/distroless/static-debian12:latest' > Dockerfile
          echo 'COPY --chmod=0755 macro /macro' >> Dockerfile
          echo 'ENV GIN_MODE=release PORT=8080' >> Dockerfile
          echo 'EXPOSE 8080' >> Dockerfile
          echo 'CMD ["/macro"]' >> Dockerfile

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Build and push image
        id: build_and_push
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: cekeh/macro:latest
          push: true

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main'
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      IMAGE_REPO: docker.io/cekeh/macro
      IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Login to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run as new revision
        run: |
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --image "${IMAGE_REPO}@${IMAGE_DIGEST}" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --quiet