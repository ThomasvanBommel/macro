name: Project Testing

on:
  push:
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Build and run backend tests
        run: docker compose run --rm test
  
  fullstack-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Pred data directory
        run: mkdir -p backend/data
      
      - name: Build image
        run: docker build --target distroless -t fullstack:${{ github.sha }} .

      - name: Health check
        run: |
          docker run --detach --rm -p 8080:8080 \
            -v ${{ github.workspace }}/backend/data:/data \
            -e SESSION_SECRET=ci_only_secret \
            --name fullstack fullstack:${{ github.sha }}

      - name: Health check
        run: |
          curl --retry 3 \
               --retry-delay 1 \
               --retry-max-time 15 \
               --retry-all-errors \
               --max-time 3 \
               --fail http://localhost:8080/api/health
      
      - name: Cleanup
        if: always()
        run: docker rm -f fullstack
  
  public-dockerhub:
    runs_on: ubuntu-latest
    needs: [backend-tests, fullstack-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: distroless
          push: true
          tags: cekeh/macro:latest